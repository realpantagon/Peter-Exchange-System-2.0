name = "peter-exchange"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Two accounts are reachable from a normal `wrangler login`, so this has to be
# explicit or every command fails in non-interactive mode.
account_id = "b76e4b50bfd52760bbbfec7ff7fc89c0"

[[d1_databases]]
binding = "DB"
database_name = "peter-exchange"
database_id = "622c3e5b-1d3c-4dde-bfc9-c0d7042d6262"
migrations_dir = "../migrations"

# The built SPA is served by this same Worker, so the API is same-origin and
# needs no CORS. `run_worker_first` is required: without it the SPA fallback
# would answer /api/* with index.html instead of letting the Worker run.
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/trigger", "/backfill", "/latest", "/rates", "/stats"]

[triggers]
crons = ["0 2 * * *"]
